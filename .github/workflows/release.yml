name: Release

# main:     release-please keeps a release pull request up to date (version + changelog from
#           conventional commits). Merging it creates the release.
# v* tags:  manual releases.
# Either way the firmware is built, all print files are attached to the release and the
# project page with the browser installer and the update manifests is deployed.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: >-
      always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
      || needs.release-please.outputs.release_created == 'true')
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish release and project page
    needs: [release-please, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ needs.release-please.outputs.tag_name }}" ]; then
            tag="${{ needs.release-please.outputs.tag_name }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag=$(git describe --tags --abbrev=0)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: generated-docs
          path: generated
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Prepare release assets and notes
        run: |
          cp cad/stl/*.stl cad/step/*.step dist/
          cp generated/docs/drawing/*.pdf generated/cad/3mf/*.3mf dist/
          python tools/release_notes.py "${{ steps.tag.outputs.version }}" > release_notes.md
          ls -l dist
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: CO2 Wall Sensor ${{ steps.tag.outputs.tag }}
          body_path: release_notes.md
          files: dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/*.bin

  pages:
    name: Deploy project page
    needs: publish
    if: always() && needs.publish.result == 'success'
    # GitHub Pages must be enabled once (Settings > Pages > Source: GitHub Actions).
    # Until then this job fails without affecting the release.
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - name: Build project page
        run: python tools/build_site.py --version "${{ needs.publish.outputs.version }}" --dist dist --out _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
