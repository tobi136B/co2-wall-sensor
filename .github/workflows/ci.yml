name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ESPHOME_VERSION: "2026.9.1"

jobs:
  docs:
    name: Docs, drawing and repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt ruff
      - name: Lint and format check
        run: |
          ruff check tools
          ruff format --check tools
      - name: Generate drawing, wiring diagram, display preview and print plates
        run: |
          python tools/drawing.py
          python tools/wiring.py
          python tools/display_preview.py
          python tools/build_3mf.py
          python tools/measure_sketch.py
      - name: Repository checks (EN/DE parity, print files match parameters, BOM links)
        run: |
          # on main the Shop links workflow updates the README tables itself
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then python tools/bom.py; fi
          python tools/check_repo.py
      - name: Check links in the documentation
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress './**/*.md'
          fail: true
      - uses: actions/upload-artifact@v7
        with:
          name: generated-docs
          path: |
            docs/drawing/
            docs/images/wiring_*.png
            docs/images/display_preview_*.png
            cad/3mf/

  firmware:
    name: Firmware (${{ matrix.id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: en
            config: co2-wall-sensor.yaml
          - id: de
            config: co2-wall-sensor-de.yaml
          - id: en-installer
            config: co2-wall-sensor-factory.yaml
          - id: de-installer
            config: co2-wall-sensor-de-factory.yaml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache PlatformIO and ESPHome build
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            esphome/.esphome
          key: esphome-${{ env.ESPHOME_VERSION }}-${{ matrix.id }}-${{ hashFiles('esphome/**/*.yaml') }}
          restore-keys: esphome-${{ env.ESPHOME_VERSION }}-${{ matrix.id }}-
      - name: Install ESPHome
        run: pip install "esphome==${ESPHOME_VERSION}"
      - name: Create CI secrets (no real credentials, only used by the own-build configs)
        run: |
          python - <<'PY'
          import base64, os
          key = base64.b64encode(os.urandom(32)).decode()
          with open("esphome/secrets.yaml", "w", encoding="utf-8") as f:
              f.write('wifi_ssid: "not-configured"\n')
              f.write('wifi_password: "not-configured"\n')
              f.write('ap_password: "co2-sensor-setup"\n')
              f.write(f'api_encryption_key: "{key}"\n')
              f.write('ota_password: "ci-build"\n')
          PY
      - name: Validate configuration
        working-directory: esphome
        run: esphome config ${{ matrix.config }} > /dev/null
      - name: Compile firmware
        working-directory: esphome
        run: esphome compile ${{ matrix.config }}
      - name: Collect binaries
        run: |
          mkdir -p dist
          factory=$(find esphome/.esphome -type f -name '*factory.bin' | head -n 1)
          ota=$(find esphome/.esphome -type f -name '*ota.bin' ! -name 'ota_data*' | head -n 1)
          [ -z "$factory" ] && factory=$(find esphome/.esphome -type f -name 'firmware.bin' | head -n 1)
          cp "$factory" "dist/co2-wall-sensor-${{ matrix.id }}.factory.bin"
          [ -z "$ota" ] && ota=$(find esphome/.esphome -type f -name 'firmware.bin' | head -n 1)
          cp "$ota" "dist/co2-wall-sensor-${{ matrix.id }}.ota.bin"
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.id }}
          path: dist/*.bin
          if-no-files-found: error
