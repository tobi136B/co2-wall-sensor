# CO2 Wall Sensor, English interface, firmware of the browser installer.
# No credentials inside: WiFi is set up via Improv (USB) or the device hotspot.
# Built by CI and published on https://tobi136b.github.io/co2-wall-sensor/

substitutions:
  language: en
  import_file: co2-wall-sensor-factory.yaml
  txt_firmware: "Firmware"
  name: co2-wall-sensor
  friendly_name: CO2 Wall Sensor
  decimal_separator: "."
  # Home Assistant entity names
  txt_temperature: "Temperature"
  txt_humidity: "Humidity"
  txt_air_quality: "Air quality"
  txt_wifi_signal: "WiFi signal"
  txt_uptime: "Uptime"
  txt_threshold_yellow: "CO2 threshold yellow"
  txt_threshold_red: "CO2 threshold red"
  txt_night_mode: "Night mode"
  txt_restart: "Restart"
  txt_calibrate: "Calibrate SCD41 (fresh air 420 ppm)"
  txt_brightness: "Display brightness"
  # Status texts on the display and in Home Assistant
  txt_status_starting: "Starting"
  txt_status_good: "Good"
  txt_status_moderate: "Moderate"
  txt_status_ventilate: "Ventilate!"
  txt_co2_trend: "CO2 trend"
  txt_co2_forecast: "Ventilate in"
  txt_forecast_display: "ventilate in ~%d min"
  # Display at night, outdoor values and window hint
  txt_night_start: "Night from"
  txt_night_end: "Night until"
  txt_night_display: "Display at night"
  txt_opt_dim: "Dim"
  txt_opt_off: "Off"
  txt_night_brightness: "Night brightness"
  txt_night_warning: "Red warning at night"
  txt_show_hint: "Window hint on the display"
  txt_show_outdoor: "Outdoor value on the display"
  txt_temp_correction: "Temperature correction"
  txt_altitude: "Altitude above sea level"
  txt_hint_temp: "Window hint from indoor temperature"
  txt_hint_delta: "Window hint: cooler outside by"
  txt_outdoor_temperature: "Outdoor temperature"
  txt_outdoor_humidity: "Outdoor humidity"
  txt_window_hint: "Window hint"
  txt_hint_cool: "Open the window: cooler outside"
  txt_hint_dry: "Airing dries the air"
  txt_hint_warm: "Keep it shut: warmer outside"
  txt_hint_short: "Air briefly: warmer outside"
  txt_hint_none: "None"
  txt_label_hum: "HUMIDITY"
  # Optional overrides (defaults in common/base.yaml)
  # co2_yellow_default: "1000"
  # co2_red_default: "1400"
  # temperature_offset: "2.0"
  # altitude: "300"

packages:
  base: !include common/base.yaml
  network: !include common/network_factory.yaml
