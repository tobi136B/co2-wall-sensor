  txt_hint_delta: "Fensterhinweis: draußen kühler um"
  txt_outdoor_temperature: "Außentemperatur"
  txt_outdoor_humidity: "Außenfeuchte"
  txt_window_hint: "Fensterhinweis"
  txt_hint_cool: "Fenster auf: außen kühler"
  txt_hint_dry: "Lüften trocknet die Luft"
  txt_hint_warm: "Fenster zu: außen wärmer"
