  txt_night_mode: "Nachtmodus"
  txt_restart: "Neustart"
  txt_calibrate: "SCD41 kalibrieren (Frischluft 420 ppm)"
  txt_brightness: "Display Helligkeit"
  # Statustexte auf dem Display und in Home Assistant
  txt_status_starting: "Messung startet"
  txt_status_good: "Gut"
  txt_status_moderate: "Mäßig"
  txt_status_ventilate: "Lüften!"
  txt_co2_trend: "CO2 Trend"
  txt_co2_forecast: "Lüften in"
  txt_forecast_display: "lüften in ca. %d min"
  # Display in der Nacht, Außenwerte und Fensterhinweis
  txt_night_start: "Nacht ab"
