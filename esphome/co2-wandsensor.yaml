# =============================================================================
#  CO2-Wandsensor  |  ESP32-C3 SuperMini + Sensirion SCD41 + Waveshare 2" IPS
# -----------------------------------------------------------------------------
#  Zeigt Luftqualitaet (CO2), Temperatur, Luftfeuchte, Verlauf und Uhrzeit.
#  Alles landet automatisch in Home Assistant (ESPHome-Integration).
#
#  Verdrahtung: siehe docs/verdrahtung.md
#  Vorbereitung: secrets.yaml.example nach secrets.yaml kopieren und ausfuellen.
# =============================================================================

substitutions:
  name: co2-wandsensor
  friendly_name: CO2 Wandsensor
  # Startwerte der Ampel, spaeter in Home Assistant einstellbar
  co2_gelb_start: "1000"
  co2_rot_start: "1400"
  # Eigenerwaermung im Gehaeuse ausgleichen (nach 24 h mit Referenz vergleichen)
  temperatur_offset: "2.0"
  # Hoehe ueber NN fuer die CO2-Druckkompensation (Langensendelbach ca. 300 m)
  hoehe_ueber_nn: "300m"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: "tobias.co2-wandsensor"
    version: "1.0.0"
  on_boot:
    priority: 600
    then:
      - light.turn_on:
          id: hintergrundlicht
          brightness: 80%

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_schluessel

ota:
  - platform: esphome
    password: !secret ota_passwort

wifi:
  ssid: !secret wlan_ssid
  password: !secret wlan_passwort
  ap:
    ssid: "${friendly_name} Setup"
    password: !secret ap_passwort

captive_portal:

time:
  - platform: homeassistant
    id: ha_zeit
    on_time:
      # Nachtmodus: Display ab 22 Uhr gedimmt, ab 6 Uhr wieder normal
      - hours: 22
        minutes: 0
        seconds: 0
        then:
          - if:
              condition:
                switch.is_on: nachtmodus
              then:
                - light.turn_on:
                    id: hintergrundlicht
                    brightness: 8%
      - hours: 6
        minutes: 0
        seconds: 0
        then:
          - if:
              condition:
                switch.is_on: nachtmodus
              then:
                - light.turn_on:
                    id: hintergrundlicht
                    brightness: 80%

# ----------------------------------------------------------------------------- Bus
i2c:
  id: bus_i2c
  sda: GPIO0
  scl: GPIO1
  frequency: 100kHz

spi:
  id: bus_spi
  clk_pin: GPIO4
  mosi_pin: GPIO6

# ----------------------------------------------------------------------------- Sensoren
sensor:
  - platform: scd4x
    i2c_id: bus_i2c
    id: scd41
    update_interval: 30s
    measurement_mode: periodic
    automatic_self_calibration: true
    altitude_compensation: ${hoehe_ueber_nn}
    temperature_offset: ${temperatur_offset}
    co2:
      id: co2
      name: "CO2"
      filters:
        - sliding_window_moving_average:
            window_size: 2
            send_every: 1
    temperature:
      id: temperatur
      name: "Temperatur"
      accuracy_decimals: 1
    humidity:
      id: feuchte
      name: "Luftfeuchtigkeit"
      accuracy_decimals: 0

  - platform: wifi_signal
    name: "WLAN Signal"
    update_interval: 120s
    entity_category: diagnostic

  - platform: uptime
    name: "Laufzeit"
    entity_category: diagnostic

text_sensor:
  - platform: template
    id: luftqualitaet
    name: "Luftqualität"
    icon: mdi:air-filter
    update_interval: 30s
    lambda: |-
      if (!id(co2).has_state()) return {"Messung startet"};
      const float c = id(co2).state;
      if (c >= id(schwelle_rot).state) return {"Lüften!"};
      if (c >= id(schwelle_gelb).state) return {"Mäßig"};
      return {"Gut"};

# ----------------------------------------------------------------------------- Bedienung in HA
number:
  - platform: template
    id: schwelle_gelb
    name: "CO2 Schwelle Gelb"
    icon: mdi:molecule-co2
    unit_of_measurement: ppm
    min_value: 600
    max_value: 2000
    step: 50
    initial_value: ${co2_gelb_start}
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: schwelle_rot
    name: "CO2 Schwelle Rot"
    icon: mdi:molecule-co2
    unit_of_measurement: ppm
    min_value: 800
    max_value: 3000
    step: 50
    initial_value: ${co2_rot_start}
    restore_value: true
    optimistic: true
    entity_category: config

switch:
  - platform: template
    id: nachtmodus
    name: "Nachtmodus (22 bis 6 Uhr dimmen)"
    icon: mdi:weather-night
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

button:
  - platform: restart
    name: "Neustart"
    entity_category: diagnostic
  - platform: template
    name: "SCD41 kalibrieren (Frischluft 420 ppm)"
    icon: mdi:tune-vertical
    entity_category: config
    on_press:
      - scd4x.perform_forced_calibration:
          value: 420
          id: scd41

# ----------------------------------------------------------------------------- Display
output:
  - platform: ledc
    id: pwm_hintergrund
    pin: GPIO10

light:
  - platform: monochromatic
    id: hintergrundlicht
    name: "Display Helligkeit"
    icon: mdi:brightness-6
    output: pwm_hintergrund
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 1s

color:
  - id: farbe_gruen
    hex: "2ECC71"
  - id: farbe_gelb
    hex: "F5B700"
  - id: farbe_rot
    hex: "E74C3C"
  - id: farbe_text
    hex: "F2F2F2"
  - id: farbe_grau
    hex: "7A7F87"
  - id: farbe_linie
    hex: "2A2E35"

font:
  - file: "gfonts://Inter@700"
    id: schrift_gross
    size: 72
    glyphs: "0123456789-"
  - file: "gfonts://Inter@600"
    id: schrift_mittel
    size: 24
    glyphs: " %,-.0123456789:C°"
  - file: "gfonts://Inter@400"
    id: schrift_klein
    size: 15
    glyphs: " !%,-.0123456789:CGLMOacdeghimnprstuäüß°"
  - file:
      type: web
      url: "https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/master/fonts/materialdesignicons-webfont.ttf"
    id: icons
    size: 22
    glyphs:
      - "\U000F050F" # mdi-thermometer
      - "\U000F058E" # mdi-water-percent
      - "\U000F05A9" # mdi-wifi
      - "\U000F05AA" # mdi-wifi-off

graph:
  - id: co2_verlauf
    duration: 3h
    x_grid: 1h
    width: 300
    height: 64
    border: false
    min_range: 400
    traces:
      - sensor: co2
        line_type: SOLID
        line_thickness: 2
        color: farbe_grau

display:
  - platform: mipi_spi
    id: anzeige
    model: ST7789V
    spi_id: bus_spi
    cs_pin: GPIO7
    dc_pin: GPIO5
    reset_pin: GPIO3
    invert_colors: true
    rotation: 90
    update_interval: 5s
    lambda: |-
      // ---------------------------------------------------------------- Layout 320 x 240
      const int B = it.get_width();
      auto komma = [](float v, int stellen) {
        char buf[16];
        snprintf(buf, sizeof(buf), "%.*f", stellen, v);
        for (char *p = buf; *p; p++) if (*p == '.') *p = ',';
        return std::string(buf);
      };

      Color stufe = id(farbe_grau);
      std::string status = "Messung startet";
      if (id(co2).has_state()) {
        const float c = id(co2).state;
        if (c >= id(schwelle_rot).state)       { stufe = id(farbe_rot);   status = "Lüften!"; }
        else if (c >= id(schwelle_gelb).state) { stufe = id(farbe_gelb);  status = "Mäßig"; }
        else                                   { stufe = id(farbe_gruen); status = "Gut"; }
      }

      // Kopfzeile: Uhrzeit links, WLAN rechts
      auto jetzt = id(ha_zeit).now();
      if (jetzt.is_valid()) it.strftime(12, 8, id(schrift_mittel), id(farbe_text), "%H:%M", jetzt);
      it.print(B - 12, 10, id(icons), wifi::global_wifi_component->is_connected() ? id(farbe_grau) : id(farbe_rot),
               TextAlign::TOP_RIGHT, wifi::global_wifi_component->is_connected() ? "\U000F05A9" : "\U000F05AA");

      // Statuspille oben mittig
      const int pb = 140, ph = 26, px = (B - pb) / 2, py = 9;
      it.filled_rectangle(px + ph / 2, py, pb - ph, ph, stufe);
      it.filled_circle(px + ph / 2, py + ph / 2, ph / 2, stufe);
      it.filled_circle(px + pb - ph / 2, py + ph / 2, ph / 2, stufe);
      it.print(B / 2, py + ph / 2 + 1, id(schrift_klein), Color::BLACK, TextAlign::CENTER, status.c_str());

      // CO2 gross
      if (id(co2).has_state()) {
        it.printf(B / 2 - 18, 84, id(schrift_gross), stufe, TextAlign::CENTER, "%.0f", id(co2).state);
      } else {
        it.print(B / 2 - 18, 84, id(schrift_gross), id(farbe_grau), TextAlign::CENTER, "--");
      }
      it.print(B - 14, 74, id(schrift_klein), id(farbe_grau), TextAlign::BOTTOM_RIGHT, "ppm");
      it.print(B - 14, 94, id(schrift_klein), id(farbe_grau), TextAlign::BOTTOM_RIGHT, "CO2");

      // Verlauf der letzten 3 Stunden
      it.line(10, 199, B - 10, 199, id(farbe_linie));
      it.graph(10, 132, id(co2_verlauf), stufe);
      it.print(12, 132, id(schrift_klein), id(farbe_grau), TextAlign::TOP_LEFT, "3h");

      // Fusszeile: Temperatur und Luftfeuchte
      if (id(temperatur).has_state()) {
        it.print(14, 225, id(icons), id(farbe_grau), TextAlign::CENTER_LEFT, "\U000F050F");
        it.print(42, 225, id(schrift_mittel), id(farbe_text), TextAlign::CENTER_LEFT,
                 (komma(id(temperatur).state, 1) + " °C").c_str());
      }
      if (id(feuchte).has_state()) {
        it.print(B - 14, 225, id(schrift_mittel), id(farbe_text), TextAlign::CENTER_RIGHT,
                 (komma(id(feuchte).state, 0) + " %").c_str());
        it.print(B - 76, 225, id(icons), id(farbe_grau), TextAlign::CENTER_RIGHT, "\U000F058E");
      }
