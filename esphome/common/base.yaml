# =============================================================================
#  CO2 Wall Sensor  |  shared firmware logic (language independent)
# -----------------------------------------------------------------------------
#  Do not flash this file directly. Use one of the device files:
#    ../co2-wall-sensor.yaml             own build, English interface
#    ../co2-wall-sensor-de.yaml          own build, German interface
#    ../co2-wall-sensor-factory.yaml     browser installer, English interface
#    ../co2-wall-sensor-de-factory.yaml  browser installer, German interface
#  Network settings come from network_secrets.yaml (own build) or
#  network_factory.yaml (browser installer, WiFi set up via Improv or hotspot).
#  All user-visible texts come from substitutions defined in the device files.
#
#  Hardware: ESP32-C3 SuperMini, Sensirion SCD41 (I2C), Waveshare 2inch LCD (ST7789V, SPI)
#  Wiring:   docs/wiring.md
# =============================================================================

substitutions:
  # Defaults, can be overridden in the device file
  co2_yellow_default: "1000"
  co2_red_default: "1400"
  temperature_offset: "2.0"     # self-heating compensation, fine-tune it in Home Assistant (temperature correction)
  altitude: "300"               # altitude above sea level in m (start value, set it in Home Assistant)
  trend_rising: "100"           # ppm per hour: from here the display shows a rising arrow
  day_brightness: "80"          # percent
  # outdoor values: a real sensor (rename its entity ID in Home Assistant) wins over the weather forecast
  outdoor_temperature_entity: sensor.outdoor_temperature
  outdoor_humidity_entity: sensor.outdoor_humidity
  weather_entity: weather.forecast_home

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: "tobi136b.co2-wall-sensor"
    version: "2.0.2"  # x-release-please-version
  on_boot:
    priority: 600
    then:
      - light.turn_on:
          id: backlight
          brightness: ${day_brightness}%

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

time:
  - platform: homeassistant
    id: ha_time

# night schedule: applied only when day and night change, so a manual change in Home Assistant stays
interval:
  - interval: 20s
    then:
      - lambda: |-
          static int last = -1;   // 0 day, 1 night dimmed, 2 night off, 3 night off but red warning
          auto now = id(ha_time).now();
          if (!now.is_valid()) return;
          const int m = now.hour * 60 + now.minute;
          const int s = id(night_start).hour * 60 + id(night_start).minute;
          const int e = id(night_end).hour * 60 + id(night_end).minute;
          bool night = s < e ? (m >= s && m < e) : (m >= s || m < e);
          if (!id(night_mode).state || s == e) night = false;
          const bool red = id(co2).has_state() && id(co2).state >= id(threshold_red).state;
          int state = 0;
          if (night) {
            if (id(night_display).active_index() == 1) state = (red && id(night_warning).state) ? 3 : 2;
            else state = 1;
          }
          if (state == last) return;
          last = state;
          if (state == 2) {
            auto call = id(backlight).turn_off();
            call.perform();
          } else {
            auto call = id(backlight).turn_on();
            call.set_brightness(state == 0 ? ${day_brightness} / 100.0f
                                           : id(night_brightness).state / 100.0f);
            call.perform();
          }

# ----------------------------------------------------------------------------- buses
i2c:
  id: i2c_bus
  sda: GPIO0
  scl: GPIO1
  frequency: 100kHz

spi:
  id: spi_bus
  clk_pin: GPIO4
  mosi_pin: GPIO6

# ----------------------------------------------------------------------------- sensors
sensor:
  - platform: scd4x
    i2c_id: i2c_bus
    id: scd41
    update_interval: 30s
    measurement_mode: periodic
    automatic_self_calibration: true
    ambient_pressure_compensation_source: air_pressure
    temperature_offset: ${temperature_offset}
    co2:
      id: co2
      name: "CO2"
      filters:
        - sliding_window_moving_average:
            window_size: 2
            send_every: 1
    temperature:
      id: temperature
      name: "${txt_temperature}"
      accuracy_decimals: 1
      filters:
        - lambda: return x + id(temp_correction).state;
    humidity:
      id: humidity
      name: "${txt_humidity}"
      accuracy_decimals: 0
      filters:
        # same amount of water at the corrected temperature: relative humidity changes with it
        - lambda: |-
            const float c = id(temp_correction).state;
            if (c == 0 || !id(temperature).has_state()) return x;
            const float t1 = id(temperature).state, t0 = t1 - c;
            auto es = [](float t) { return 6.112f * expf(17.62f * t / (243.12f + t)); };
            return x * es(t0) / es(t1);

  # air pressure from the altitude set in Home Assistant, for the CO2 pressure compensation
  - platform: template
    id: air_pressure
    internal: true
    unit_of_measurement: hPa
    update_interval: 60s
    lambda: return 1013.25f * powf(1.0f - 2.25577e-5f * id(altitude_m).state, 5.25588f);

  # outdoor values from Home Assistant: a real sensor first, the weather forecast otherwise
  - platform: homeassistant
    id: outdoor_temp_sensor
    entity_id: ${outdoor_temperature_entity}
    internal: true
  - platform: homeassistant
    id: outdoor_hum_sensor
    entity_id: ${outdoor_humidity_entity}
    internal: true
  - platform: homeassistant
    id: weather_temp
    entity_id: ${weather_entity}
    attribute: temperature
    internal: true
  - platform: homeassistant
    id: weather_hum
    entity_id: ${weather_entity}
    attribute: humidity
    internal: true
  - platform: template
    id: outdoor_temperature
    name: "${txt_outdoor_temperature}"
    icon: mdi:home-thermometer-outline
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      if (id(outdoor_temp_sensor).has_state() && !std::isnan(id(outdoor_temp_sensor).state))
        return id(outdoor_temp_sensor).state;
      if (id(weather_temp).has_state()) return id(weather_temp).state;
      return NAN;
  - platform: template
    id: outdoor_humidity
    name: "${txt_outdoor_humidity}"
    icon: mdi:water-percent
    unit_of_measurement: "%"
    device_class: humidity
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      if (id(outdoor_hum_sensor).has_state() && !std::isnan(id(outdoor_hum_sensor).state))
        return id(outdoor_hum_sensor).state;
      if (id(weather_hum).has_state()) return id(weather_hum).state;
      return NAN;

  - platform: wifi_signal
    name: "${txt_wifi_signal}"
    update_interval: 120s
    entity_category: diagnostic

  - platform: uptime
    name: "${txt_uptime}"
    entity_category: diagnostic

  # CO2 trend: slope of a linear fit over the last 15 minutes, in ppm per hour
  - platform: template
    id: co2_trend
    name: "${txt_co2_trend}"
    icon: mdi:chart-line-variant
    unit_of_measurement: "ppm/h"
    accuracy_decimals: 0
    state_class: measurement
    update_interval: 60s
    lambda: |-
      static float samples[15];
      static int count = 0, head = 0;
      if (!id(co2).has_state()) return {};
      samples[head] = id(co2).state;
      head = (head + 1) % 15;
      if (count < 15) count++;
      if (count < 5) return {};
      // least squares slope, x in minutes (oldest sample first)
      float sx = 0, sy = 0, sxx = 0, sxy = 0;
      for (int i = 0; i < count; i++) {
        const float x = i;
        const float y = samples[(head - count + i + 15) % 15];
        sx += x; sy += y; sxx += x * x; sxy += x * y;
      }
      const float n = count;
      const float slope = (n * sxy - sx * sy) / (n * sxx - sx * sx);
      return slope * 60.0f;

  # minutes until the red threshold is reached at the current trend (only while rising)
  - platform: template
    id: co2_forecast
    name: "${txt_co2_forecast}"
    icon: mdi:timer-sand
    unit_of_measurement: min
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      if (!id(co2).has_state() || !id(co2_trend).has_state()) return NAN;
      const float c = id(co2).state, red = id(threshold_red).state, trend = id(co2_trend).state;
      if (c >= red) return 0;
      if (trend < ${trend_rising}) return NAN;
      const float minutes = (red - c) / trend * 60.0f;
      return minutes > 240 ? NAN : minutes;

text_sensor:
  # window hint: only when opening the window really helps (or would make it worse)
  - platform: template
    id: window_hint
    name: "${txt_window_hint}"
    icon: mdi:window-open-variant
    update_interval: 60s
    lambda: |-
      // hysteresis: a hint that is shown stays until its condition is clearly gone (0.5 K, 0.5 g/m3),
      // so it does not flicker while the temperatures hover around a threshold
      static std::string last = "${txt_hint_none}";
      const float ti = id(temperature).state, hi = id(humidity).state;
      const float to = id(outdoor_temperature).state, ho = id(outdoor_humidity).state;
      if (std::isnan(ti) || std::isnan(to)) { last = "${txt_hint_none}"; return last; }
      auto keep = [&](const char *h) { return last == h ? 0.5f : 0.0f; };
      const bool stale = id(co2).has_state() && id(co2).state >= id(threshold_yellow).state;
      if (ti >= id(hint_temp).state - keep("${txt_hint_cool}") &&
          to <= ti - id(hint_delta).state + keep("${txt_hint_cool}")) { last = "${txt_hint_cool}"; return last; }
      // absolute humidity in g/m3: airing dries the room when the outdoor air holds clearly less water
      auto ah = [](float t, float rh) { return 216.7f * rh / 100.0f * 6.112f * expf(17.62f * t / (243.12f + t)) / (273.15f + t); };
      if (!std::isnan(hi) && !std::isnan(ho) && hi >= 60 - 2 * keep("${txt_hint_dry}") &&
          ah(to, ho) <= ah(ti, hi) - 2.0f + keep("${txt_hint_dry}")) { last = "${txt_hint_dry}"; return last; }
      // warmer outside: keep the window shut, unless the air needs a change anyway (then air briefly)
      const char *warm = stale ? "${txt_hint_short}" : "${txt_hint_warm}";
      if (ti >= id(hint_temp).state - keep(warm) && to >= ti + 1.0f - keep(warm)) { last = warm; return last; }
      last = "${txt_hint_none}";
      return last;
  - platform: template
    id: air_quality
    name: "${txt_air_quality}"
    icon: mdi:air-filter
    update_interval: 30s
    lambda: |-
      if (!id(co2).has_state()) return {"${txt_status_starting}"};
      const float c = id(co2).state;
      if (c >= id(threshold_red).state) return {"${txt_status_ventilate}"};
      if (c >= id(threshold_yellow).state) return {"${txt_status_moderate}"};
      return {"${txt_status_good}"};

# ----------------------------------------------------------------------------- controls in Home Assistant
number:
  - platform: template
    id: threshold_yellow
    name: "${txt_threshold_yellow}"
    icon: mdi:molecule-co2
    unit_of_measurement: ppm
    min_value: 600
    max_value: 2000
    step: 50
    initial_value: ${co2_yellow_default}
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: threshold_red
    name: "${txt_threshold_red}"
    icon: mdi:molecule-co2
    unit_of_measurement: ppm
    min_value: 800
    max_value: 3000
    step: 50
    initial_value: ${co2_red_default}
    restore_value: true
    optimistic: true
    entity_category: config

  - platform: template
    id: night_brightness
    name: "${txt_night_brightness}"
    icon: mdi:brightness-4
    unit_of_measurement: "%"
    min_value: 1
    max_value: 50
    step: 1
    initial_value: 8
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: temp_correction
    name: "${txt_temp_correction}"
    icon: mdi:thermometer-lines
    unit_of_measurement: "°C"
    min_value: -5
    max_value: 5
    step: 0.1
    initial_value: 0
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: altitude_m
    name: "${txt_altitude}"
    icon: mdi:image-filter-hdr
    unit_of_measurement: m
    min_value: 0
    max_value: 3000
    step: 10
    initial_value: ${altitude}
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: hint_temp
    name: "${txt_hint_temp}"
    icon: mdi:window-open-variant
    unit_of_measurement: "°C"
    min_value: 18
    max_value: 30
    step: 0.5
    initial_value: 24
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: hint_delta
    name: "${txt_hint_delta}"
    icon: mdi:window-open-variant
    unit_of_measurement: "°C"
    min_value: 1
    max_value: 10
    step: 0.5
    initial_value: 3
    restore_value: true
    optimistic: true
    entity_category: config

datetime:
  - platform: template
    id: night_start
    type: time
    name: "${txt_night_start}"
    optimistic: true
    restore_value: true
    initial_value: "22:00"
    entity_category: config
  - platform: template
    id: night_end
    type: time
    name: "${txt_night_end}"
    optimistic: true
    restore_value: true
    initial_value: "06:00"
    entity_category: config

select:
  - platform: template
    id: night_display
    name: "${txt_night_display}"
    icon: mdi:monitor-shimmer
    options:
      - "${txt_opt_dim}"
      - "${txt_opt_off}"
    initial_option: "${txt_opt_dim}"
    restore_value: true
    optimistic: true
    entity_category: config

switch:
  - platform: template
    id: night_mode
    name: "${txt_night_mode}"
    icon: mdi:weather-night
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
  - platform: template
    id: night_warning
    name: "${txt_night_warning}"
    icon: mdi:alarm-light-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
  - platform: template
    id: show_hint
    name: "${txt_show_hint}"
    icon: mdi:window-open-variant
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
  - platform: template
    id: show_outdoor
    name: "${txt_show_outdoor}"
    icon: mdi:home-thermometer-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
  # the housing decides how the display sits; if the picture stands on its head, turn it here
  - platform: template
    id: flip_display
    name: "${txt_flip_display}"
    icon: mdi:screen-rotation
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_on:
      - lambda: id(lcd).set_rotation(display::DISPLAY_ROTATION_270_DEGREES);
    on_turn_off:
      - lambda: id(lcd).set_rotation(display::DISPLAY_ROTATION_90_DEGREES);

button:
  - platform: restart
    name: "${txt_restart}"
    entity_category: diagnostic
  - platform: template
    name: "${txt_calibrate}"
    icon: mdi:tune-vertical
    entity_category: config
    on_press:
      - scd4x.perform_forced_calibration:
          value: 420
          id: scd41

# ----------------------------------------------------------------------------- display
output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO10

light:
  - platform: monochromatic
    id: backlight
    name: "${txt_brightness}"
    icon: mdi:brightness-6
    output: backlight_pwm
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 1s

color:
  - id: col_green
    hex: "2ECC71"
  - id: col_yellow
    hex: "F5B700"
  - id: col_red
    hex: "E74C3C"
  - id: col_text
    hex: "F2F2F2"
  - id: col_muted
    hex: "7A7F87"
  - id: col_line
    hex: "2A2E35"
  - id: col_out
    hex: "AFB6BE"
  - id: col_cool
    hex: "5ABEFF"
  - id: col_warm
    hex: "FFAA3C"

font:
  - file: "gfonts://Inter@700"
    id: font_big
    size: 72
    glyphs: "0123456789-"
  - file: "gfonts://Inter@600"
    id: font_medium
    size: 24
    glyphs: " %,-.0123456789:C°"
  - file: "gfonts://Inter@600"
    id: font_value
    size: 21
    glyphs: " %,-.0123456789:C°"
  - file: "gfonts://Inter@700"
    id: font_label
    size: 11
    glyphs: " ABCDEFGHIJKLMNOPQRSTUVWXYZ"
  # Superset of all status texts in English and German
  - file: "gfonts://Inter@400"
    id: font_small
    size: 15
    glyphs: " !%,-.0123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzäöüÄÖÜß°~"
  - file: "gfonts://Inter@700"
    id: font_hint
    size: 15
    glyphs: " !%,-.0123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzäöüÄÖÜß°~"
  - file:
      type: web
      url: "https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/master/fonts/materialdesignicons-webfont.ttf"
    id: icons
    size: 22
    glyphs:
      - "\U000F050F" # mdi-thermometer
      - "\U000F058E" # mdi-water-percent
      - "\U000F05A9" # mdi-wifi
      - "\U000F05AA" # mdi-wifi-off
  - file:
      type: web
      url: "https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/master/fonts/materialdesignicons-webfont.ttf"
    id: icons_trend
    size: 26
    glyphs:
      - "\U000F005C" # mdi-arrow-top-right
      - "\U000F0054" # mdi-arrow-right
      - "\U000F0043" # mdi-arrow-bottom-right

graph:
  - id: co2_graph
    duration: 3h
    x_grid: 1h
    width: 300
    height: 64
    border: false
    min_range: 400
    traces:
      - sensor: co2
        line_type: SOLID
        line_thickness: 2
        color: col_muted

display:
  - platform: mipi_spi
    id: lcd
    model: ST7789V
    spi_id: spi_bus
    cs_pin: GPIO7
    dc_pin: GPIO5
    reset_pin: GPIO3
    invert_colors: true
    rotation: 90            # display upright: its connector on the left, seen from the back
    update_interval: 5s
    lambda: |-
      // ------------------------------------------------------------ layout 320 x 240
      const int W = it.get_width();
      auto fmt = [](float v, int decimals) {
        char buf[16];
        snprintf(buf, sizeof(buf), "%.*f", decimals, v);
        for (char *p = buf; *p; p++) if (*p == '.') *p = "${decimal_separator}"[0];
        return std::string(buf);
      };

      Color level = id(col_muted);
      std::string status = "${txt_status_starting}";
      if (id(co2).has_state()) {
        const float c = id(co2).state;
        if (c >= id(threshold_red).state)         { level = id(col_red);    status = "${txt_status_ventilate}"; }
        else if (c >= id(threshold_yellow).state) { level = id(col_yellow); status = "${txt_status_moderate}"; }
        else                                      { level = id(col_green);  status = "${txt_status_good}"; }
      }

      // header: time left, WiFi right
      auto now = id(ha_time).now();
      if (now.is_valid()) it.strftime(12, 8, id(font_medium), id(col_text), "%H:%M", now);
      const bool online = wifi::global_wifi_component->is_connected();
      it.print(W - 12, 10, id(icons), online ? id(col_muted) : id(col_red), TextAlign::TOP_RIGHT,
               online ? "\U000F05A9" : "\U000F05AA");

      // status pill
      const int pw = 140, ph = 26, px = (W - pw) / 2, py = 9;
      it.filled_rectangle(px + ph / 2, py, pw - ph, ph, level);
      it.filled_circle(px + ph / 2, py + ph / 2, ph / 2, level);
      it.filled_circle(px + pw - ph / 2, py + ph / 2, ph / 2, level);
      it.print(W / 2, py + ph / 2 + 1, id(font_small), Color::BLACK, TextAlign::CENTER, status.c_str());

      // CO2 value
      if (id(co2).has_state()) {
        it.printf(W / 2 - 18, 84, id(font_big), level, TextAlign::CENTER, "%.0f", id(co2).state);
      } else {
        it.print(W / 2 - 18, 84, id(font_big), id(col_muted), TextAlign::CENTER, "--");
      }
      it.print(W - 14, 74, id(font_small), id(col_muted), TextAlign::BOTTOM_RIGHT, "ppm");
      it.print(W - 14, 94, id(font_small), id(col_muted), TextAlign::BOTTOM_RIGHT, "CO2");

      // trend arrow below the unit: rising, steady or falling over the last 15 minutes
      if (id(co2_trend).has_state()) {
        const float tr = id(co2_trend).state;
        const char *arrow = "\U000F0054";
        Color col = id(col_muted);
        if (tr >= ${trend_rising})       { arrow = "\U000F005C"; col = level; }
        else if (tr <= -${trend_rising}) { arrow = "\U000F0043"; col = id(col_green); }
        it.print(W - 14, 100, id(icons_trend), col, TextAlign::TOP_RIGHT, arrow);
      }

      // trend of the last 3 hours
      it.line(10, 199, W - 10, 199, id(col_line));
      it.graph(10, 132, id(co2_graph), level);
      it.print(12, 132, id(font_small), id(col_muted), TextAlign::TOP_LEFT, "3h");
      // window hint above the footer, left, with a coloured marker like a status light
      int hint_end = 0;
      if (id(show_hint).state && id(window_hint).has_state()) {
        const std::string h = id(window_hint).state;
        Color hc = id(col_cool);
        if (h == "${txt_hint_warm}" || h == "${txt_hint_short}") hc = id(col_warm);
        if (h != "${txt_hint_none}") {
          int bx, by, bw, bh;
          it.get_text_bounds(27, 196, h.c_str(), id(font_hint), TextAlign::BOTTOM_LEFT, &bx, &by, &bw, &bh);
          it.filled_circle(17, 188, 4, hc);
          it.print(27, 196, id(font_hint), hc, TextAlign::BOTTOM_LEFT, h.c_str());
          hint_end = bx + bw;
        }
      }
      // forecast: when the red threshold will be reached (bottom right: a rising curve is high on the right).
      // It gives way to the window hint if both do not fit side by side.
      if (id(co2_forecast).has_state() && !std::isnan(id(co2_forecast).state) && id(co2_forecast).state > 0) {
        char fc[40];
        snprintf(fc, sizeof(fc), "${txt_forecast_display}", (int) id(co2_forecast).state);
        int fx, fy, fw, fh;
        it.get_text_bounds(W - 12, 196, fc, id(font_small), TextAlign::BOTTOM_RIGHT, &fx, &fy, &fw, &fh);
        if (hint_end == 0 || fx > hint_end + 12)
          it.print(W - 12, 196, id(font_small), id(col_muted), TextAlign::BOTTOM_RIGHT, fc);
      }

      // footer like an instrument panel: IN, OUT and humidity with a small label above each value
      const bool out = id(show_outdoor).state && !std::isnan(id(outdoor_temperature).state);
      auto column = [&](int x, TextAlign a1, TextAlign a2, const char *label, const std::string &value, Color c) {
        it.print(x, 210, id(font_label), id(col_muted), a1, label);
        it.print(x, 228, id(font_value), c, a2, value.c_str());
      };
      if (id(temperature).has_state())
        column(14, TextAlign::CENTER_LEFT, TextAlign::CENTER_LEFT, "IN", fmt(id(temperature).state, 1) + " °C",
               id(col_text));
      if (out) {
        column(116, TextAlign::CENTER_LEFT, TextAlign::CENTER_LEFT, "OUT", fmt(id(outdoor_temperature).state, 1) + " °C",
               id(col_out));
        it.line(106, 205, 106, 234, id(col_line));
        it.line(214, 205, 214, 234, id(col_line));
      }
      if (id(humidity).has_state())
        column(W - 14, TextAlign::CENTER_RIGHT, TextAlign::CENTER_RIGHT, "${txt_label_hum}",
               fmt(id(humidity).state, 0) + " %", id(col_text));
