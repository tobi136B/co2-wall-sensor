# =============================================================================
#  CO2 Wall Sensor  |  network settings for your own build
# -----------------------------------------------------------------------------
#  Credentials come from secrets.yaml (copy secrets.yaml.example).
#  Used by co2-wall-sensor.yaml and co2-wall-sensor-de.yaml.
# =============================================================================

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Many ESP32-C3 SuperMini boards have a poorly matched antenna and drop the
  # connection at full transmit power. 8.5 dB is a well known stable value.
  output_power: 8.5dB
  ap:
    ssid: "${friendly_name} Setup"
    password: !secret ap_password

captive_portal:
