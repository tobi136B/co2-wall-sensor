# Steps of the interactive 3D assembly guide (site/assembly.html).
#
#   new:     parts that appear in this step (ids of site/assembly.js)
#   from:    where the new parts fly in from, offset in mm (x left seen from the front, y up, z towards the wall)
#   from_part: the same for single parts that come from another side
#   camera:  eye and target in mm, model coordinates of the Fusion generator (front z = 0, wall towards +z)
#   title / text: English and German

- new: [housing]
  from: [0, 0, 60]
  camera: {eye: [-70, 70, 150], target: [0, 0, 10]}
  need:
    en: "Printed housing"
    de: "Gedrucktes Gehäuse"
  tip:
    en: "No supports needed. Remove the brim and check that the four cover seats in the corners are clean."
    de: "Kein Stützmaterial nötig. Den Rand (Brim) entfernen und prüfen, dass die vier Deckelsitze in den Ecken sauber sind."
  title:
    en: The housing
    de: Das Gehäuse
  text:
    en: Printed front face down. You look at it from the back, the side that later faces the wall. Right and left in this guide are always seen from the back, like here.
    de: Mit der Front nach unten gedruckt. Du schaust von hinten darauf, auf die Seite, die später zur Wand zeigt. Rechts und links sind in dieser Anleitung immer von hinten gesehen, so wie hier.

- new: [inserts]
  from: [0, 0, 25]
  camera: {eye: [-55, 65, 135], target: [0, 0, 12]}
  need:
    en: "10 heat-set inserts M2 × 3, soldering iron at 200 to 220 °C"
    de: "10 Einschmelzmuttern M2 × 3, Lötkolben auf 200 bis 220 °C"
  tip:
    en: "Set the insert on the hole, touch it with the iron and let it sink under its own weight until it is flush. Do not push. The front behind the 4 display domes is only 1.1 mm thick: little heat, no pressure."
    de: "Mutter auf das Loch setzen, mit dem Lötkolben antippen und unter Eigengewicht einsinken lassen, bis sie bündig ist. Nicht drücken. Hinter den 4 Displaydomen ist die Front nur 1,1 mm dick: wenig Hitze, kein Druck."
  title:
    en: 10 heat-set inserts
    de: 10 Einschmelzmuttern
  text:
    en: Press the M2 inserts in with the soldering iron (about 200 to 220 °C). 4 around the display bay, 4 for the back cover, 2 for the sensor carrier. The entry chamfer centres them.
    de: Die M2-Muttern mit dem Lötkolben eindrücken (ca. 200 bis 220 °C). 4 rund um den Displayschacht, 4 für den Rückdeckel, 2 für den Sensorträger. Die Einführschräge zentriert sie.

- new: [display, display_screws]
  from: [0, 0, 45]
  camera: {eye: [-45, 55, 140], target: [6, 8, 8]}
  need:
    en: "Display with its cable plugged in, 4 screws M2 × 4, hex key 1.3 mm"
    de: "Display mit eingestecktem Kabel, 4 Schrauben M2 × 4, Innensechskant 1,3 mm"
  tip:
    en: "It fits only one way: the connector on the right, where the bay is longer. The picture then appears upside down on your desk, the firmware turns it. Keep the protective film on the glass until the end."
    de: "Es passt nur in einer Richtung: Stecker nach rechts, wo der Schacht länger ist. Auf dem Tisch steht das Bild dann auf dem Kopf, die Firmware dreht es. Die Schutzfolie auf dem Glas bis zum Schluss drauflassen."
  title:
    en: Display
    de: Display
  text:
    en: Plug the supplied cable into the display first. Then glass first into the display bay, connector to the right, and 4 screws M2 × 4 through the corner holes.
    de: Zuerst das mitgelieferte Kabel ins Display stecken. Dann mit dem Glas voran in den Displayschacht, Stecker nach rechts, und 4 Schrauben M2 × 4 durch die Ecklöcher.

- new: [carrier]
  from: [0, 0, 55]
  stage: carrier_out
  camera: {eye: [-165, 60, 255], target: [0, -28, 32]}
  need:
    en: "Sensor carrier for your SCD41 board"
    de: "Sensorträger für deine SCD41-Platine"
  tip:
    en: "Not sure which board you have? See [measure your sensor](measure-sensor.md)."
    de: "Unsicher, welche Platine du hast? Siehe [Sensor ausmessen](sensor-ausmessen.md)."
  title:
    en: Sensor carrier
    de: Sensorträger
  text:
    en: The carrier is the removable floor of the sensor chamber and holds the ESP32-C3 on its back. Print the one that matches your SCD41 board, here the 13.5 × 21.75 mm version.
    de: Der Träger ist der herausnehmbare Boden der Sensorkammer und hält auf seiner Rückseite den ESP32-C3. Drucke den, der zu deiner SCD41-Platine passt, hier die Version 13,5 × 21,75 mm.

- new: [scd41]
  from: [0, 30, 0]
  stage: carrier_out
  camera: {eye: [-75, -55, -45], target: [0, -72, 62]}
  need:
    en: "SCD41, 4 wires of about 8 cm, soldering iron"
    de: "SCD41, 4 Litzen von ca. 8 cm, Lötkolben"
  tip:
    en: "To take the board out again, push the spring tongue back with a small screwdriver."
    de: "Zum Herausnehmen die Federzunge mit einem kleinen Schraubendreher zurückdrücken."
  title:
    en: SCD41 into the rails
    de: SCD41 in die Schienen
  text:
    en: Solder four wires of about 8 cm to the pads first. Then slide the board in from the top, sensor towards you, pads towards the wire slot, until the spring tongue clicks over the upper edge.
    de: Zuerst vier Litzen von ca. 8 cm an die Lötpunkte löten. Dann die Platine von oben einschieben, Sensor zeigt zu dir, Lötpunkte zum Kabelschlitz, bis die Federzunge über die Oberkante schnappt.

- new: [esp32]
  from: [0, 35, 0]
  stage: carrier_out
  camera: {eye: [-125, 50, 245], target: [10, -30, 42]}
  need:
    en: "ESP32-C3 SuperMini"
    de: "ESP32-C3 SuperMini"
  tip:
    en: "To take it out again, press the hook down with a small screwdriver and slide the board up."
    de: "Zum Herausnehmen den Haken mit einem kleinen Schraubendreher nach unten drücken und die Platine nach oben schieben."
  title:
    en: ESP32-C3 onto the sled
    de: ESP32-C3 auf den Schlitten
  text:
    en: Chip side up, USB-C socket down. Put it on the top of the sled and slide it down between the guides until it stands on the end stops. The hook clicks behind its upper edge.
    de: Bauteile nach oben, USB-C-Buchse nach unten. Oben auf den Schlitten legen und zwischen den Führungen nach unten schieben, bis er auf den Anschlägen steht. Der Haken schnappt hinter seine Oberkante.

- new: [adapter]
  from: [0, -25, 0]
  stage: carrier_out
  camera: {eye: [-70, -150, 215], target: [14, -72, 58]}
  need:
    en: "USB-C 90° adapter (plug to socket)"
    de: "USB-C-Winkeladapter 90° (Stecker auf Buchse)"
  tip:
    en: "Cable on the wall instead? Leave the adapter out and later plug a straight cable in from below through the window in the bottom of the housing."
    de: "Lieber ein Kabel auf Putz? Den Adapter weglassen und später ein gerades Kabel von unten durch das Fenster im Gehäuseboden einstecken."
  title:
    en: USB-C adapter
    de: USB-C-Adapter
  text:
    en: Push the adapter up into the socket of the ESP32-C3, its body points to the back. The carrier is open below the socket. Later the cable goes straight back into the wall box.
    de: Den Adapter von unten in die Buchse des ESP32-C3 stecken, sein Körper zeigt nach hinten. Der Träger ist unter der Buchse offen. Später geht das Kabel gerade nach hinten in die Wanddose.

- new: [carrier_screws]
  from: [0, 0, 20]
  stage: carrier_in
  camera: {eye: [-70, 70, 165], target: [6, -10, 14]}
  need:
    en: "2 screws M2 × 4"
    de: "2 Schrauben M2 × 4"
  tip:
    en: "Lay the four SCD41 wires into the narrow wire slot from its open end before, then the sensor chamber stays apart from the warm electronics without glue."
    de: "Die vier SCD41-Litzen vorher von der offenen Seite in den schmalen Kabelschlitz legen, dann bleibt die Sensorkammer ohne Kleber von der warmen Elektronik getrennt."
  title:
    en: Carrier into the housing
    de: Träger ins Gehäuse
  text:
    en: Put the carrier onto the ledges in the chin, the sled slides over the display connector. Fix it with 2 screws M2 × 4.
    de: Den Träger auf die Leisten im Kinn legen, der Schlitten gleitet über den Displaystecker. Mit 2 Schrauben M2 × 4 festschrauben.

- new: [wires_display, wires_scd]
  draw: true
  stage: carrier_in
  camera: {eye: [-35, 80, 150], target: [10, -2, 16]}
  need:
    en: "The cable of the display (shortened), soldering iron, the [wiring diagram](wiring.md)"
    de: "Das Kabel des Displays (gekürzt), Lötkolben, den [Verdrahtungsplan](verdrahtung.md)"
  tip:
    en: "Push the cable under the bridge first and mark the length of every wire at its pad, then shorten and solder. The cable stays plugged into the display: to take the display out, just pull the plug."
    de: "Das Kabel zuerst unter der Brücke durchschieben und die Länge jeder Ader an ihrem Lötpunkt anzeichnen, dann kürzen und löten. Das Kabel bleibt im Display stecken: Zum Ausbauen des Displays nur den Stecker ziehen."
  title:
    en: Wiring
    de: Verdrahtung
  text:
    en: "Display: the flat cable runs up at the right wall, over to the sled and under its bridge, every wire goes to its pad. SCD41: the 4 wires along the clip channel of the carrier and over the left guide. Colours as in the wiring diagram."
    de: "Display: Das Flachkabel läuft an der rechten Wand hoch, hinüber zum Schlitten und unter seiner Brücke durch, jede Ader geht zu ihrem Lötpunkt. SCD41: die 4 Litzen am Kabelkanal des Trägers entlang und über die linke Führung. Farben wie im Verdrahtungsplan."

- new: [cover, cover_screws]
  from: [0, 0, 50]
  stage: carrier_in
  camera: {eye: [-80, 65, 165], target: [0, 0, 18]}
  need:
    en: "Back cover, 4 screws M2 × 4"
    de: "Rückdeckel, 4 Schrauben M2 × 4"
  tip:
    en: "Nothing may stick out of the back except the adapter: the heads sit below the surface, otherwise the device does not slide onto the wall plate."
    de: "Hinten darf außer dem Adapter nichts überstehen: Die Köpfe liegen versenkt, sonst lässt sich das Gerät nicht auf die Wandplatte schieben."
  title:
    en: Back cover
    de: Rückdeckel
  text:
    en: Put the cover into its seat, the adapter passes through its hole. Fix it with 4 screws M2 × 4.
    de: Den Deckel in seinen Sitz legen, der Adapter geht durch sein Loch. Mit 4 Schrauben M2 × 4 festschrauben.

- new: [wall_plate, wall_screws]
  from: [0, 0, 60]
  from_part: {wall_screws: [0, 0, -25]}
  stage: device_away
  camera: {eye: [-150, 80, -190], target: [0, 5, -15]}
  need:
    en: "Wall plate, 2 screws M4 with 6 mm wall plugs (or the 2 screws of a flush box)"
    de: "Wandplatte, 2 Schrauben M4 mit 6er Dübeln (oder die 2 Schrauben einer Hohlwanddose)"
  tip:
    en: "Power in a flush box: a USB power module (work on 230 V only by a qualified electrician) or a USB cable in the wall. Lead the cable through the passage of the plate."
    de: "Strom in einer Unterputzdose: ein USB-Netzteil (Arbeiten an 230 V nur durch eine Elektrofachkraft) oder ein USB-Kabel in der Wand. Das Kabel durch den Durchlass der Platte führen."
  title:
    en: Wall plate
    de: Wandplatte
  text:
    en: Screw the plate to the wall, label to the wall, 60 mm between the screws. The slots give 3 mm play up and down, the recesses take pan heads and countersunk heads.
    de: Die Platte an die Wand schrauben, Beschriftung zur Wand, 60 mm Abstand zwischen den Schrauben. Die Langlöcher geben 3 mm Spiel nach oben und unten, die Senkungen nehmen Linsen- und Senkköpfe.

- new: []
  stage: device_slide
  camera: {eye: [-150, 50, -120], target: [0, 5, 10]}
  need:
    en: "Nothing"
    de: "Nichts"
  tip:
    en: "Plug the cable into the adapter before you put the device on the rail."
    de: "Das Kabel in den Adapter stecken, bevor du das Gerät auf die Schiene setzt."
  title:
    en: Slide the device on
    de: Gerät aufsetzen
  text:
    en: Hold the device in front of the plate, put the rail into the hidden window and slide it 15 mm down. Done. To remove it, slide it up and pull it off.
    de: Gerät vor die Platte halten, die Schiene in das verdeckte Fenster stecken und 15 mm nach unten schieben. Fertig. Zum Abnehmen nach oben schieben und abziehen.
