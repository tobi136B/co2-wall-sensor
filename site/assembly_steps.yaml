# Steps of the interactive 3D assembly guide (site/assembly.html).
#
#   new:     parts that appear in this step (ids of site/assembly.js)
#   from:    where the new parts fly in from, offset in mm (x left seen from the front, y up, z towards the wall)
#   from_part: the same for single parts that come from another side
#   camera:  eye and target in mm, model coordinates of the Fusion generator (front z = 0, wall towards +z)
#   title / text: English and German

- new: [housing]
  from: [0, 0, 60]
  camera: {eye: [-70, 70, 150], target: [0, 0, 10]}
  need:
    en: "Printed housing"
    de: "Gedrucktes Gehäuse"
  tip:
    en: "No supports needed. Remove the brim and check that the four cover seats in the corners are clean."
    de: "Kein Stützmaterial nötig. Den Rand (Brim) entfernen und prüfen, dass die vier Deckelsitze in den Ecken sauber sind."
  title:
    en: The housing
    de: Das Gehäuse
  text:
    en: Printed front face down. You look at it from the back, the side that later faces the wall.
    de: Mit der Front nach unten gedruckt. Du schaust von hinten darauf, auf die Seite, die später zur Wand zeigt.

- new: [inserts]
  from: [0, 0, 25]
  camera: {eye: [-55, 65, 135], target: [0, 0, 12]}
  need:
    en: "10 heat-set inserts M2 × 3, soldering iron at 200 to 220 °C"
    de: "10 Einschmelzmuttern M2 × 3, Lötkolben auf 200 bis 220 °C"
  tip:
    en: "Set the insert on the hole, touch it with the iron and let it sink under its own weight until it is flush. Do not push. The front behind the 4 display domes is only 1.1 mm thick: little heat, no pressure."
    de: "Mutter auf das Loch setzen, mit dem Lötkolben antippen und unter Eigengewicht einsinken lassen, bis sie bündig ist. Nicht drücken. Hinter den 4 Displaydomen ist die Front nur 1,1 mm dick: wenig Hitze, kein Druck."
  title:
    en: 10 heat-set inserts
    de: 10 Einschmelzmuttern
  text:
    en: Press the M2 inserts in with the soldering iron (about 200 to 220 °C). 4 around the display bay, 4 for the back cover, 2 for the sensor carrier. The entry chamfer centres them.
    de: Die M2-Muttern mit dem Lötkolben eindrücken (ca. 200 bis 220 °C). 4 rund um den Displayschacht, 4 für den Rückdeckel, 2 für den Sensorträger. Die Einführschräge zentriert sie.

- new: [display, display_screws]
  from: [0, 0, 45]
  camera: {eye: [-45, 55, 140], target: [0, 6, 8]}
  need:
    en: "Display, 4 screws M2 × 4, hex key 1.3 mm"
    de: "Display, 4 Schrauben M2 × 4, Innensechskant 1,3 mm"
  tip:
    en: "Test the electronics on the desk before you build them in: wire everything, flash the firmware and check the display. Keep the protective film on the glass until the end."
    de: "Die Elektronik vorher auf dem Tisch testen: alles verdrahten, Firmware flashen und das Display prüfen. Die Schutzfolie auf dem Glas bis zum Schluss drauflassen."
  title:
    en: Display
    de: Display
  text:
    en: Glass first into the display bay, then 4 screws M2 × 4 through the corner holes of the display board.
    de: Mit dem Glas voran in den Displayschacht legen, dann 4 Schrauben M2 × 4 durch die Ecklöcher der Displayplatine.

- new: [carrier]
  from: [0, 0, 55]
  stage: carrier_out
  camera: {eye: [-165, 60, 255], target: [0, -28, 32]}
  need:
    en: "Sensor carrier for your SCD41 board"
    de: "Sensorträger für deine SCD41-Platine"
  tip:
    en: "Not sure which board you have? See [measure your sensor](measure-sensor.md)."
    de: "Unsicher, welche Platine du hast? Siehe [Sensor ausmessen](sensor-ausmessen.md)."
  title:
    en: Sensor carrier
    de: Sensorträger
  text:
    en: The carrier is the removable floor of the sensor chamber. Print the one that matches your SCD41 board, here the 13.5 × 21.75 mm version.
    de: Der Träger ist der herausnehmbare Boden der Sensorkammer. Drucke den, der zu deiner SCD41-Platine passt, hier die Version 13,5 × 21,75 mm.

- new: [scd41]
  from: [0, 30, 0]
  stage: carrier_out
  camera: {eye: [-75, -55, -45], target: [0, -72, 62]}
  need:
    en: "SCD41, 4 wires of about 8 cm, soldering iron"
    de: "SCD41, 4 Litzen von ca. 8 cm, Lötkolben"
  tip:
    en: "To take the board out again, push the spring tongue back with a small screwdriver."
    de: "Zum Herausnehmen die Federzunge mit einem kleinen Schraubendreher zurückdrücken."
  title:
    en: SCD41 into the rails
    de: SCD41 in die Schienen
  text:
    en: Solder four wires of about 8 cm to the pads first. Then slide the board in from the top, sensor towards you, pads towards the wire slot. The spring tongue clicks over the upper edge. Lay the four wires side by side into the narrow slot from its open end and press them on the back under the lip of the wire clip.
    de: Zuerst vier Litzen von ca. 8 cm an die Lötpunkte löten. Dann die Platine von oben einschieben, Sensor zeigt zu dir, Lötpunkte zum Kabelschlitz. Die Federzunge schnappt über die Oberkante. Die vier Litzen nebeneinander von der offenen Seite in den schmalen Schlitz legen und auf der Rückseite unter die Lippe des Kabelclips drücken.

- new: [esp32, plug]
  from: [0, 35, 0]
  from_part: {plug: [0, -15, 0]}
  stage: carrier_out
  camera: {eye: [-125, 50, 245], target: [5, -36, 42]}
  need:
    en: "ESP32-C3 SuperMini, USB cable with right-angle plug"
    de: "ESP32-C3 SuperMini, USB-Kabel mit Winkelstecker"
  tip:
    en: "Back port module: lay the cable into the side slot of the module first. Bottom port module: push the straight plug through the module from outside first."
    de: "Modul hinten: das Kabel vorher seitlich in den Schlitz des Moduls legen. Modul unten: den geraden Stecker vorher von außen durch das Modul schieben."
  title:
    en: ESP32-C3 on the back
    de: ESP32-C3 auf der Rückseite
  text:
    en: Slide the ESP32-C3 from above between the side guides until it rests on the end stops and slips under the two small lips. Then plug the USB cable in from below, the carrier is open below the socket.
    de: Den ESP32-C3 von oben zwischen die Seitenführungen schieben, bis er auf den Anschlägen sitzt und unter die beiden kleinen Lippen rutscht. Dann das USB-Kabel von unten einstecken, der Träger ist unter der Buchse offen.

- new: [carrier_screws]
  from: [0, 0, 20]
  stage: carrier_in
  camera: {eye: [-60, 55, 150], target: [0, -14, 14]}
  need:
    en: "2 screws M2 × 4"
    de: "2 Schrauben M2 × 4"
  tip:
    en: "Nothing to seal: the four SCD41 wires fill the narrow wire slot, so the sensor chamber stays apart from the warm electronics without glue."
    de: "Nichts abdichten: Die vier SCD41-Litzen füllen den schmalen Kabelschlitz, so bleibt die Sensorkammer ohne Kleber von der warmen Elektronik getrennt."
  title:
    en: Carrier into the housing
    de: Träger ins Gehäuse
  text:
    en: Put the carrier onto the ledges in the chin and fix it with 2 screws M2 × 4. It closes the sensor chamber against the warm electronics.
    de: Den Träger auf die Leisten im Kinn legen und mit 2 Schrauben M2 × 4 festschrauben. Er schließt die Sensorkammer gegen die warme Elektronik ab.

- new: [wires_display, wires_scd]
  draw: true
  stage: carrier_in
  camera: {eye: [-30, 60, 135], target: [0, -4, 15]}
  need:
    en: "The cable supplied with the display (shortened), soldering iron, the [wiring diagram](wiring.md)"
    de: "Das Kabel, das dem Display beiliegt (gekürzt), Lötkolben, den [Verdrahtungsplan](verdrahtung.md)"
  tip:
    en: "Shorten the display cable to about 5 cm before soldering. Then it lies flat and straight on the back of the display and cannot touch anything else."
    de: "Das Displaykabel vor dem Löten auf ca. 5 cm kürzen. Dann liegt es flach und gerade auf der Rückseite des Displays und kann nirgends anstoßen."
  title:
    en: Wiring
    de: Verdrahtung
  text:
    en: "Display: the 8 wires of the supplied cable run straight from the connector across the back of the display to the upper end of the ESP32-C3. SCD41: 4 wires through the wire slot and along the clip channel of the carrier. Colours as in the wiring diagram."
    de: "Display: Die 8 Adern des mitgelieferten Kabels laufen vom Stecker gerade über die Rückseite des Displays zum oberen Ende des ESP32-C3. SCD41: 4 Litzen durch den Kabelschlitz und am Kabelclip des Trägers entlang. Farben wie im Verdrahtungsplan."

- new: [port]
  from: [0, 0, 45]
  stage: carrier_in
  camera: {eye: [-70, -60, 170], target: [10, -20, 15]}
  need:
    en: "Cable port module: back (right-angle plug) or bottom (straight plug)"
    de: "Kabelport-Modul: hinten (Winkelstecker) oder unten (gerader Stecker)"
  tip:
    en: "Print both modules and decide on site. Swapping later takes four screws."
    de: "Beide Module drucken und vor Ort entscheiden. Später wechseln kostet vier Schrauben."
  title:
    en: Cable port module
    de: Kabelport-Modul
  text:
    en: Slide the module into the opening at the lower back edge. Back module for a right-angle plug into the wall box, bottom module for a cable on the wall.
    de: Das Modul in die Öffnung an der unteren hinteren Kante schieben. Modul hinten für den Winkelstecker in die Wanddose, Modul unten für ein Kabel auf Putz.

- new: [cover, cover_screws]
  from: [0, 0, 50]
  stage: carrier_in
  camera: {eye: [-80, 65, 165], target: [0, 0, 18]}
  need:
    en: "Back cover, 4 screws M2 × 4"
    de: "Rückdeckel, 4 Schrauben M2 × 4"
  tip:
    en: "Nothing may stick out of the back: the heads sit below the surface, otherwise the device does not slide onto the wall plate."
    de: "Hinten darf nichts überstehen: Die Köpfe liegen versenkt, sonst lässt sich das Gerät nicht auf die Wandplatte schieben."
  title:
    en: Back cover
    de: Rückdeckel
  text:
    en: Put the cover into its seat and fix it with 4 screws M2 × 4. The heads sit below the surface, so the cover still slides onto the wall plate.
    de: Den Deckel in seinen Sitz legen und mit 4 Schrauben M2 × 4 festschrauben. Die Köpfe liegen unter der Oberfläche, der Deckel gleitet trotzdem auf die Wandplatte.

- new: [wall_plate]
  from: [0, 0, 60]
  stage: device_away
  camera: {eye: [-150, 80, -190], target: [0, 5, -15]}
  need:
    en: "Wall plate, the 2 screws of the flush box"
    de: "Wandplatte, die 2 Schrauben der Hohlwanddose"
  tip:
    en: "Power in the box: a flush mounted USB power module (work on 230 V only by a qualified electrician) or a USB cable inside the wall. Lead the cable through the passage of the plate."
    de: "Strom in der Dose: ein Unterputz-USB-Netzteil (Arbeiten an 230 V nur durch eine Elektrofachkraft) oder ein USB-Kabel in der Wand. Das Kabel durch den Durchlass der Platte führen."
  title:
    en: Wall plate on the flush box
    de: Wandplatte auf die Hohlwanddose
  text:
    en: Screw the wall plate to the two device screws of the flush box (60 mm apart). The slotted holes even out a slightly twisted box.
    de: Die Wandplatte mit den beiden Geräteschrauben der Hohlwanddose festschrauben (60 mm Abstand). Die Langlöcher gleichen eine leicht verdrehte Dose aus.

- new: []
  stage: device_slide
  camera: {eye: [-150, 50, -120], target: [0, 5, 10]}
  need:
    en: "Nothing"
    de: "Nichts"
  tip:
    en: "Plug the cable into the device before you put it on the rail."
    de: "Das Kabel ins Gerät stecken, bevor du es auf die Schiene setzt."
  title:
    en: Slide the device on
    de: Gerät aufsetzen
  text:
    en: Hold the device in front of the plate, put the rail into the hidden window and slide it 15 mm down. Done. To remove it, slide it up and pull it off.
    de: Gerät vor die Platte halten, die Schiene in das verdeckte Fenster stecken und 15 mm nach unten schieben. Fertig. Zum Abnehmen nach oben schieben und abziehen.

- new: [lock_insert_housing, lock_insert_plate, lock_tab, lock_screw_housing, lock_screw_plate]
  from: [0, -30, 0]
  from_part: {lock_insert_plate: [0, 0, -20], lock_screw_plate: [0, 0, -25]}
  camera: {eye: [-110, -125, -150], target: [-8, -28, 15]}
  need:
    en: "Lock tab, 2 heat-set inserts and 2 screws M2 × 4"
    de: "Sicherungslasche, 2 Einschmelzmuttern und 2 Schrauben M2 × 4"
  tip:
    en: "Only where needed. To take the device off later, remove the tab first."
    de: "Nur wo nötig. Zum Abnehmen später zuerst die Lasche abschrauben."
  title:
    en: Optional lock tab
    de: Optionale Sicherungslasche
  text:
    en: In an office, a school or with children, press one insert into the bottom of the housing and one into the wall plate, then screw the small tab on from below (2 screws M2 × 4). Then the device cannot be slid off the wall.
    de: Im Büro, in der Schule oder bei Kindern je eine Mutter unten ins Gehäuse und in die Wandplatte einschmelzen, dann die kleine Lasche von unten anschrauben (2 Schrauben M2 × 4). Dann lässt sich das Gerät nicht mehr von der Wand schieben.
