blueprint:
  name: CO2 ventilation reminder / Lüftungserinnerung
  description: >-
    Notifications on your phone that follow the window: ventilate when the CO2 level stays high and the
    window is shut, close the window when the air is fresh again or when the room cools down too much.
    The thresholds come straight from the CO2 Wall Sensor (https://github.com/tobi136B/co2-wall-sensor):
    change them on the device in Home Assistant, the blueprint follows. Every message can be switched off.


    Benachrichtigungen aufs Handy, die dem Fenster folgen: lüften, wenn der CO2-Wert hoch bleibt und das
    Fenster zu ist, Fenster schließen, wenn die Luft wieder frisch ist oder der Raum zu stark auskühlt.
    Die Grenzwerte kommen direkt vom CO2-Wandsensor: am Gerät in Home Assistant ändern, der Blueprint
    folgt. Jede Nachricht lässt sich abschalten.
  domain: automation
  homeassistant:
    min_version: 2024.6.0
  source_url: https://github.com/tobi136B/co2-wall-sensor/blob/main/homeassistant/blueprints/co2_ventilation_reminder.yaml
  input:
    device_values:
      name: CO2 Wall Sensor / CO2-Wandsensor
      description: Sensors and thresholds of the device. / Sensoren und Grenzwerte des Geräts.
      input:
        co2_sensor:
          name: CO2
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: carbon_dioxide
        temperature_sensor:
          name: Temperature / Temperatur
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature
        red_threshold:
          name: CO2 threshold red / CO2 Schwelle Rot
          description: Ventilate above this value. / Lüften über diesem Wert.
          selector:
            entity:
              filter:
                - domain: number
        fresh_level:
          name: Fresh air below / Luft frisch unter
          selector:
            entity:
              filter:
                - domain: number
        cool_temp:
          name: Window warning below / Fensterwarnung unter
          selector:
            entity:
              filter:
                - domain: number
    window_section:
      name: Window / Fenster
      input:
        window:
          name: Window contact or group / Fensterkontakt oder Gruppe
          description: >-
            Optional. The same binary sensor group the device uses (on = a window is open). Without it you
            only get the ventilation message. / Optional. Dieselbe Binärsensor-Gruppe wie am Gerät (an = ein
            Fenster ist offen). Ohne sie gibt es nur die Lüftungsnachricht.
          default: ""
          selector:
            entity:
              filter:
                - domain: binary_sensor
    messages:
      name: Messages / Nachrichten
      input:
        notify_device:
          name: Phone / Handy
          description: Device with the Home Assistant companion app.
          selector:
            device:
              filter:
                - integration: mobile_app
        delay:
          name: Ventilate only after / Lüften erst nach
          description: The level has to stay above the red threshold this long.
          default:
            minutes: 5
          selector:
            duration:
        send_ventilate:
          name: "Message: ventilate / Nachricht: lüften"
          default: true
          selector:
            boolean:
        send_fresh:
          name: "Message: fresh air, close the window / Nachricht: Luft frisch, Fenster zu"
          default: true
          selector:
            boolean:
        send_cold:
          name: "Message: room cools down / Nachricht: Raum kühlt aus"
          default: true
          selector:
            boolean:
        text_ventilate:
          name: Text ventilate / Text lüften
          default: "Ventilate! / Lüften!"
          selector:
            text:
        text_fresh:
          name: Text fresh air / Text Luft frisch
          default: "Fresh air, you can close the window. / Luft frisch, Fenster kann zu."
          selector:
            text:
        text_cold:
          name: Text room cools down / Text Raum kühlt aus
          default: "Close the window, the room cools down. / Fenster zu, der Raum kühlt aus."
          selector:
            text:

mode: queued
max: 5
max_exceeded: silent

# The triggers are conditions, so they also fire when the window changes: shut the window while the
# level is high and the reminder still comes, open it in a cold room and the warning comes.
trigger_variables:
  t_co2: !input co2_sensor
  t_temp: !input temperature_sensor
  t_red: !input red_threshold
  t_fresh: !input fresh_level
  t_cool: !input cool_temp
  t_window: !input window

trigger:
  - platform: template
    id: high
    value_template: >-
      {{ states(t_co2) | float(0) > states(t_red) | float(100000)
         and not (t_window != '' and is_state(t_window, 'on')) }}
    for: !input delay
  - platform: template
    id: fresh
    value_template: >-
      {{ t_window != '' and is_state(t_window, 'on')
         and states(t_co2) | float(100000) < states(t_fresh) | float(0) }}
    for:
      minutes: 1
  - platform: template
    id: cold
    value_template: >-
      {{ t_window != '' and is_state(t_window, 'on')
         and states(t_temp) | float(100) < states(t_cool) | float(-100) }}
    for:
      minutes: 1

variables:
  co2: !input co2_sensor
  name: "{{ state_attr(co2, 'friendly_name') or co2 }}"
  send_ventilate: !input send_ventilate
  send_fresh: !input send_fresh
  send_cold: !input send_cold

action:
  - choose:
      - conditions:
          - condition: trigger
            id: high
          - "{{ send_ventilate }}"
        sequence:
          - domain: mobile_app
            type: notify
            device_id: !input notify_device
            title: !input text_ventilate
            message: "{{ name }}: {{ states(co2) | int(0) }} ppm"
      - conditions:
          - condition: trigger
            id: fresh
          - "{{ send_fresh }}"
        sequence:
          - domain: mobile_app
            type: notify
            device_id: !input notify_device
            message: !input text_fresh
      - conditions:
          - condition: trigger
            id: cold
          - "{{ send_cold }}"
        sequence:
          - domain: mobile_app
            type: notify
            device_id: !input notify_device
            message: !input text_cold
